name: Build Signed APK

on:
  push:
    branches:
      - uat
      - pre-prod
      - prod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android Keystore
        run: |
          echo "${{ secrets.CICD_APP_BASE_64_JKS_FILE }}" | base64 -d > android/app/cicdapp-release.jks

      - name: Create Signing Properties
        run: |
          cat > android/signing.properties << EOF
          MYAPP_UPLOAD_STORE_FILE=cicdapp-release.jks
          MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.CICD_APP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.CICD_APP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.CICD_APP_UPLOAD_KEY_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Signed APK
        working-directory: android
        run: ./gradlew clean assembleRelease

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/app-release.apk